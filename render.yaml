services:
  - type: web
    name: beheard-zimbabwe
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 1 --timeout 180 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: BEHEARD_DATA_DIR
        value: /tmp/beheard
      - key: PYTHON_VERSION
        value: 3.13.9
