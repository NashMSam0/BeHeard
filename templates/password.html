<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change password | BeHeard Zimbabwe</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/styles.css"></head><body class="editor"><main class="wrap admin-password"><a href="/founder/">Back to dashboard</a><h1>Change password</h1><p>Use at least 14 characters. Changing your password signs out all existing admin sessions.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required maxlength="200"></label><label>New password<input type="password" name="new_password" autocomplete="new-password" required minlength="14" maxlength="200"></label><label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" required minlength="14" maxlength="200"></label><button type="submit">Change password</button></form></main></body></html>
