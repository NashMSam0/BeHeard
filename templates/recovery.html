<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner password recovery</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/styles.css"><script src="/admin-controls.js" defer></script></head><body class="editor"><main class="wrap admin-password"><a href="/admindashboard/login">Admin sign-in</a><h1>Reset admin password</h1><p>The site owner’s private recovery code is required.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Owner recovery code<input type="password" name="recovery_code" autocomplete="off" required></label><label>New password<input type="password" name="new_password" minlength="14" maxlength="200" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="14" maxlength="200" autocomplete="new-password" required></label><button>Reset password</button></form></main></body></html>
